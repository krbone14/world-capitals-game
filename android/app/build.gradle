apply plugin: 'com.android.application'

// Release signing. The key and its passwords live in android/keystore.properties,
// which is gitignored and never leaves this machine: Google Play accepts updates
// to an app only from the key that first published it, so losing or leaking it
// cannot be undone by rotating anything. Without that file the project still
// configures and builds — only the release signing is skipped — so a clone, or
// CI, is not broken by a secret it does not have.

// versionCode is the number of commits behind HEAD. Play only ever requires it
// to increase, and a commit is the smallest thing that can change what ships —
// so this is monotonic by construction, identical for identical source, and
// there is no number anywhere that someone has to remember to bump.
//
// -PversionCode=<n> overrides it, for the one case the history cannot answer:
// an upload Play has already seen burns its number even if it was rejected, and
// the replacement has to be higher than the commit count alone would give.
//
// It fails rather than guessing. A silent fallback would hand Play a code lower
// than one it has already accepted, and that is discovered at upload time with
// an error that says nothing about where the number came from.
def resolveVersionCode = {
    if (project.hasProperty('versionCode')) {
        return project.property('versionCode').toString().toInteger()
    }
    try {
        return providers.exec {
            commandLine 'git', 'rev-list', '--count', 'HEAD'
        }.standardOutput.asText.get().trim().toInteger()
    } catch (Exception e) {
        throw new GradleException(
            "versionCode: could not count the commits (" + e.message + "). " +
            "Build from a git clone, or pass -PversionCode=<n>.")
    }
}
def appVersionCode = resolveVersionCode()

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "io.github.krbone14.worldcapitals"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.krbone14.worldcapitals"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
