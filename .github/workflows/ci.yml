# Two checks and a deploy.
#
#   validate — the generated files against each other. No dependencies at all,
#              so it needs neither npm install nor a browser.
#   smoke    — the real thing in a real Chromium: every map paints, every
#              capital is reachable, a round can be won in all three modes.
#   deploy   — publishes the page to GitHub Pages.
#
# The two checks run in parallel: when both break, seeing both failures at once
# beats gating one on the other. The deploy waits for both, so a push that fails
# them updates nothing that a player can reach.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A push that supersedes an in-flight run makes that run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node tools/validate-data.mjs

  smoke:
    name: end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Install build/test dependencies
        run: npm ci
        working-directory: tools

      # ~170 MB, and it only changes when playwright does — so key the cache on
      # the lockfile that pins it.
      - name: Restore Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('tools/package-lock.json') }}

      # --with-deps installs the system libraries Chromium needs on a bare
      # runner; those live outside the cached directory, so this runs either way
      # and is a no-op download when the cache hit.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: tools

      # --shots always: the screenshots cost nothing to take during a run that
      # already navigates every screen, and re-running a failed test to collect
      # them would just as likely fail somewhere else.
      - run: node tests/smoke.mjs --shots

      # On a red run they are usually the fastest way to see what the map did.
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: tests/.shots/
          if-no-files-found: ignore

  # The site is served straight from the repository root — there is no build
  # step — so the deploy is just "upload the checkout and publish it". What it
  # adds over the branch-based Pages build it replaces is the `needs:` below:
  # the live game is only ever replaced by a commit that passed both checks.
  deploy:
    name: deploy to Pages
    needs: [validate, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write      # deploy-pages authenticates to Pages with OIDC
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # The whole checkout, exactly as the branch-based build served it. tools/
      # and tests/ ride along unused; excluding them would risk dropping a file
      # index.html or the service worker actually asks for.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
